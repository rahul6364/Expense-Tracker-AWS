repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.98.0
    hooks:
      - id: terraform_fmt

      - id: terraform_validate
        args:
          - --hook-config=--tf-init-args=-backend=false

      - id: terraform_tflint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks